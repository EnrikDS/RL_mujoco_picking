[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-mujoco-picking"
version = "0.1.0"
description = "RL algorithms for robotic picking using MuJoCo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
rl = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
